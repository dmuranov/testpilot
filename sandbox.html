<!--
  A fully simulated walkthrough of the real app (Learn New App, Flow Test,
  Security Test) for visitors who want to see TestPilot work before signing
  up. Every class, color and copy string below is lifted from index.html —
  the real, shipped, logged-in app shell. Only the target app (plazoabierto.es)
  and its two scripted findings are fabricated for the demo.
-->
<style>
  :root {
    --bg: #080808; --bg-card: #111111; --bg-hover: #1a1a1a; --bg-input: #0d0d0d;
    --border: rgba(244,242,238,0.07); --border-focus: #c8f040;
    --text: #f4f2ee; --text-dim: #d8d8d8; --text-muted: #a8a8a8;
    --accent: #c8f040; --accent-glow: rgba(200,240,64,0.1);
    --green: #22c55e; --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444; --red-dim: rgba(239,68,68,0.12);
    --yellow: #eab308; --yellow-dim: rgba(234,179,8,0.12);
    --purple: #a855f7; --radius: 2px; --radius-lg: 4px;
    color-scheme: dark;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(200,240,64,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(200,240,64,0.025) 1px, transparent 1px);
    background-size:60px 60px; pointer-events:none; z-index:0;
  }
  .app { display:flex; min-height:100vh; position:relative; z-index:1; }
  .sidebar { width:240px; background:var(--bg-card); border-right:1px solid var(--border); padding:20px 0; flex-shrink:0; display:flex; flex-direction:column; }
  .logo { padding:0 20px 24px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .logo h1 { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; letter-spacing:-0.5px; }
  .logo h1 span { color:var(--accent); }
  .logo .tagline { font-size:10px; color:var(--text-muted); font-family:'DM Mono',monospace; display:block; margin-top:2px; letter-spacing:0.5px; }
  .nav-section { padding:0 12px; margin-bottom:8px; }
  .nav-section label { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); padding:0 8px; display:block; margin-bottom:6px; }
  .nav-section-toggle { display:flex; align-items:center; justify-content:space-between; width:100%; padding:0 8px; margin-bottom:6px; border:none; background:none; cursor:default; font-family:inherit; }
  .nav-section-toggle span { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-muted); }
  .nav-chevron { width:12px; height:12px; color:var(--text-muted); flex-shrink:0; }
  .nav-btn { display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:none; background:none; color:var(--text-dim); font-size:13px; font-family:inherit; cursor:pointer; border-radius:6px; transition:all .15s; text-align:left; }
  .nav-btn:hover { background:var(--bg-hover); color:var(--text); }
  .nav-btn.active { background:var(--accent-glow); color:var(--accent); }
  .nav-btn svg { width:16px; height:16px; flex-shrink:0; }
  .main { flex:1; padding:24px 32px; overflow-y:auto; max-height:100vh; }
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
  .page-header h2 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .card-title { font-size:14px; font-weight:600; color:var(--text); }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:5px; font-family:'DM Mono',monospace; }
  .form-input, .form-textarea { width:100%; padding:10px 12px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:13px; font-family:inherit; outline:none; }
  .form-input:focus, .form-textarea:focus { border-color:var(--border-focus); box-shadow:0 0 0 3px var(--accent-glow); }
  .form-textarea { min-height:80px; resize:vertical; }
  .btn { padding:9px 18px; border:none; border-radius:var(--radius); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--accent); color:#080808; font-weight:700; }
  .btn-primary:hover { opacity:0.9; }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-ghost { background:none; color:var(--text-dim); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--bg-hover); color:var(--text); }
  .btn-sm { padding:5px 10px; font-size:11px; }
  .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:99px; font-size:11px; font-weight:600; font-family:'DM Mono',monospace; }
  .badge-green { background:var(--green-dim); color:var(--green); }
  .badge-red { background:var(--red-dim); color:var(--red); }
  .badge-yellow { background:var(--yellow-dim); color:var(--yellow); }
  .app-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; cursor:pointer; transition:all .15s; margin-bottom:10px; }
  .app-card:hover { border-color:var(--accent); background:var(--bg-hover); }
  .app-card-name { font-size:15px; font-weight:600; }
  .app-card-url { font-size:11px; color:var(--text-muted); font-family:'DM Mono',monospace; }
  .app-card-meta { display:flex; gap:12px; margin-top:10px; font-size:12px; color:var(--text-dim); }
  .stats-row { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-card { flex:1; min-width:110px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .stat-value { font-size:24px; font-weight:700; font-family:'DM Mono',monospace; }
  .stat-label { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .test-stream { max-height:420px; overflow-y:auto; font-family:'DM Mono',monospace; font-size:12px; padding:8px 0; transition:max-height .3s ease; }
  .test-stream.zoomed { max-height:none; font-size:13.5px; }
  .step-line { display:flex; align-items:flex-start; gap:8px; padding:6px 10px; border-radius:4px; margin-bottom:2px; line-height:1.5; }
  .test-stream.zoomed .step-line { padding:9px 12px; }
  .step-line:hover { background:var(--bg-hover); }
  .step-icon { flex-shrink:0; font-size:14px; margin-top:1px; }
  .step-pass .step-icon { color:var(--green); }
  .step-fail .step-icon { color:var(--red); }
  .step-retry .step-icon { color:var(--text-muted); }
  .step-bug .step-icon { color:var(--yellow); }
  .step-info .step-icon { color:var(--accent); }
  .step-done .step-icon, .step-summary .step-icon { color:var(--purple); }
  #learn-stream .step-fail { background:rgba(239,68,68,0.1); border-left:3px solid var(--red); padding-left:7px; font-weight:600; }
  .step-text { color:var(--text-dim); word-break:break-word; flex:1; }
  .step-pass .step-text { color:var(--text); }
  .step-retry .step-text { color:var(--text-muted); font-size:11px; }
  .step-screenshot-btn { flex-shrink:0; background:none; border:1px solid var(--border); color:var(--text-muted); padding:2px 6px; border-radius:4px; font-size:10px; cursor:pointer; font-family:inherit; }
  .step-screenshot-btn:hover { background:var(--bg-hover); color:var(--text); }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:1000; padding:24px; }
  .modal-content { max-width:min(640px,92vw); max-height:90vh; border-radius:var(--radius-lg); overflow:hidden; position:relative; background:var(--bg-card); border:1px solid rgba(200,240,64,0.35); box-shadow:0 0 40px rgba(200,240,64,0.08), 0 20px 60px rgba(0,0,0,0.6); }
  .modal-close { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); border:none; color:white; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; z-index:2; }
  .loader { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  ::-webkit-scrollbar { width:7px; height:7px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:8px; }

  .browser-frame { border:1px solid var(--border); border-radius:6px; overflow:hidden; background:#e9e9e6; }
  .browser-chrome { background:#1c1c1c; padding:8px 10px; display:flex; align-items:center; gap:8px; }
  .browser-dot { width:8px; height:8px; border-radius:50%; background:#3a3a3a; }
  .browser-url { flex:1; background:#0d0d0d; border-radius:3px; padding:4px 10px; font-family:'DM Mono',monospace; font-size:10.5px; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mock-page { padding:22px; min-height:220px; color:#1a1a1a; }
  .mock-header { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .mock-logo { width:22px; height:22px; border-radius:4px; background:#c8f040; }
  .mock-navbit { width:46px; height:8px; border-radius:3px; background:#ccc; }
  .mock-line { height:9px; border-radius:3px; background:#d8d8d5; margin-bottom:8px; }
  .mock-field { height:30px; border-radius:4px; background:#fff; border:1px solid #ccc; margin-bottom:10px; }
  .mock-btn { height:32px; width:110px; border-radius:4px; background:#080808; }

  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#1c1c1c; border:1px solid var(--accent); color:var(--text); font-size:13px; font-weight:600; font-family:'DM Mono',monospace; padding:12px 20px; border-radius:6px; z-index:2000; box-shadow:0 10px 32px rgba(0,0,0,0.6), 0 0 0 4px rgba(200,240,64,0.08); animation:toastIn .18s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  .done-banner { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:14px; padding:16px 18px; background:var(--bg-card); border:1px solid var(--accent); border-radius:var(--radius-lg); }
  .done-banner .done-text { font-size:13px; color:var(--text); }

  .restart-pill { position:fixed; top:14px; right:16px; z-index:1500; background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted); font-size:11px; font-family:'DM Mono',monospace; padding:6px 12px; border-radius:99px; cursor:pointer; }
  .restart-pill:hover { color:var(--text); border-color:var(--accent); }

  .nudge { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:700; color:var(--accent); font-family:'DM Mono',monospace; margin-bottom:16px; padding:14px 18px; background:rgba(200,240,64,0.08); border:1px solid rgba(200,240,64,0.4); border-radius:6px; line-height:1.4; }
  .nudge .nudge-arrow { font-size:22px; flex-shrink:0; animation:nudgeBounce 1.1s ease-in-out infinite; }
  @keyframes nudgeBounce { 0%,100% { transform:translateX(0); } 50% { transform:translateX(5px); } }
  .pulse { animation:pulseGlow 1.9s ease-out infinite; }
  @keyframes pulseGlow {
    0% { box-shadow:0 0 0 0 rgba(200,240,64,0.45); }
    70% { box-shadow:0 0 0 16px rgba(200,240,64,0); }
    100% { box-shadow:0 0 0 0 rgba(200,240,64,0); }
  }
  .fake-cursor { position:fixed; z-index:2500; pointer-events:none; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    transition:left .68s cubic-bezier(.5,0,.2,1), top .68s cubic-bezier(.5,0,.2,1), transform .15s ease; }
  .fake-cursor.press { transform:scale(0.82); }
  .fake-cursor-tag { position:absolute; left:20px; top:16px; white-space:nowrap; font-size:10px; color:#080808;
    background:var(--accent); padding:2px 7px; border-radius:5px; font-family:'DM Mono',monospace; font-weight:700; }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation:none; box-shadow:0 0 0 5px rgba(200,240,64,0.3); }
    .fake-cursor { transition-duration:.01s; }
  }

  /* ── printable report, ported from downloadTestReport / downloadSecReport ── */

  .tp-report .rp-logo span { color:#c8f040; background:#080808; padding:2px 6px; }
  .tp-report .meta-table { width:100%; border-collapse:collapse; margin-bottom:24px; }
  .tp-report .meta-table td { padding:7px 12px; border:1px solid #e5e5e5; font-size:13px; }
  .tp-report .meta-table td:first-child { font-weight:600; background:#f9f9f9; width:140px; color:#555; }
  .tp-report .rp-stats { display:flex; gap:16px; margin:20px 0 28px; flex-wrap:wrap; }
  .tp-report .rp-stat { flex:1; min-width:100px; text-align:center; padding:16px; border:1px solid #e5e5e5; border-radius:4px; }
  .tp-report .rp-stat-num { font-size:28px; font-weight:800; }

  .tp-report .rp-stat.green .rp-stat-num { color:#16a34a; }

  .tp-report .vuln-sev { font-size:10px; font-weight:700; padding:2px 8px; border-radius:2px; text-transform:uppercase; color:#fff; }
  .tp-report .vuln-type { font-size:10px; font-weight:600; color:#666; background:#f3f4f6; padding:2px 8px; border-radius:2px; text-transform:uppercase; }

  .tp-report .vuln-body { padding:14px 16px; }

  .tp-report .vuln-request { font-family:monospace; font-size:11px; color:#555; background:#f3f4f6; padding:6px 10px; border-radius:3px; margin-bottom:8px; word-break:break-all; }
  .tp-report .no-vulns { background:#f0fdf4; border:1px solid #86efac; border-radius:4px; padding:16px 20px; color:#16a34a; font-weight:600; }
  .tp-report .pass-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }

<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SEV_COLOR = { high:'#dc2626', medium:'#d97706', low:'#2563eb', critical:'#dc2626' };

function useTypedStream(script, active, speed){
  const [lines, setLines] = useState([]);
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (!active) return;
    setLines([]); setDone(false);
    let i = 0; let cancelled = false;
    function step(){
      if (cancelled) return;
      if (i >= script.length){ setDone(true); return; }
      setLines(prev => [...prev, script[i]]);
      i += 1;
      setTimeout(step, speed + 120 * Math.random());
    }
    const kick = setTimeout(step, 300);
    return () => { cancelled = true; clearTimeout(kick); };
  }, [script, active]);
  return [lines, done];
}

function useAutoScroll(dep){
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [dep]);
  return ref;
}

/* A viewer who is just watching the demo (not the person driving it) has no
   reason to know they should click anything — this auto-clicks the primary
   CTA after a few seconds of inactivity, same as a kiosk/unattended walkthrough. */
function FakeCursor({ target, onArrived }){
  const [pos, setPos] = useState(null);
  const [pressed, setPressed] = useState(false);
  useEffect(() => {
    if (!target) return;
    setPos({ x: window.innerWidth * 0.82, y: window.innerHeight * 0.86 });
    const t1 = setTimeout(() => setPos({ x: target.x, y: target.y }), 60);
    const t2 = setTimeout(() => setPressed(true), 780);
    const t3 = setTimeout(onArrived, 1000);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [target]);
  if (!pos) return null;
  return (
    <div className={'fake-cursor' + (pressed ? ' press' : '')} style={{left:pos.x, top:pos.y}}>
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M2 1.5 L2 17 L6.2 13.4 L9 20 L12 18.6 L9.2 12 L15 12 Z" fill="#f4f2ee" stroke="#080808" strokeWidth="1"/>
      </svg>
      <span className="fake-cursor-tag">auto-demo</span>
    </div>
  );
}

function App(){
  const [view, setView] = useState('learn');
  const [learned, setLearned] = useState(false);
  const [flowStage, setFlowStage] = useState('setup');
  const [secStage, setSecStage] = useState('setup');
  const [shot, setShot] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2800); };

  const onNav = (id) => {
    if (id === 'learn' || id === 'apps') { setView(id); return; }
    if (id === 'security' || id === 'flow') {
      if (!learned) { showToast('Learn an app first — click "Learn New App".'); setView('learn'); return; }
      setView(id); return;
    }
    showToast('Not wired up in this sandbox demo.');
  };

  const onLearnDone = (next) => {
    setLearned(true);
    if (next) setView(next); else setView('learn');
  };

  const reset = () => {
    setView('learn'); setLearned(false); setFlowStage('setup'); setSecStage('setup'); setShot(null); setToast(null);
  };

  return (
    <div className="app">
      <button className="restart-pill" onClick={reset}>↺ restart demo</button>
      <Sidebar view={view} appLearned={learned} onNav={onNav} />
      <div className="main">
        {view === 'learn' && <LearnPage learned={learned} onDone={onLearnDone} onReport={() => setView('learn-report')} />}
        {view === 'learn-report' && (
          <div>
            <button className="btn btn-ghost btn-sm" style={{marginBottom:14}} onClick={() => setView('learn')}>← Back</button>
            <LearnReportView />
          </div>
        )}
        {view === 'apps' && <AppsPage learned={learned} onNav={onNav} />}
        {view === 'flow' && flowStage !== 'report' && (
          <FlowTestPage
            stage={flowStage}
            onRun={() => { setFlowStage('running'); setTimeout(() => setFlowStage('running-done'), FLOW_SCRIPT.length * 620 + 800); }}
            onReport={() => setFlowStage('report')}
            onShot={setShot}
          />
        )}
        {view === 'flow' && flowStage === 'report' && (
          <div>
            <button className="btn btn-ghost btn-sm" style={{marginBottom:14}} onClick={() => setFlowStage('running-done')}>← Back to test</button>
            <FlowReportView />
          </div>
        )}
        {view === 'security' && secStage !== 'report' && (
          <SecurityTestPage
            stage={secStage}
            onRun={() => { setSecStage('running'); setTimeout(() => setSecStage('running-done'), SECURITY_SCRIPT.length * 560 + 800); }}
            onReport={() => setSecStage('report')}
            onShot={setShot}
          />
        )}
        {view === 'security' && secStage === 'report' && (
          <div>
            <button className="btn btn-ghost btn-sm" style={{marginBottom:14}} onClick={() => setSecStage('running-done')}>← Back to scan</button>
            <SecurityReportView />
          </div>
        )}
      </div>
      <ScreenshotModal variant={shot} onClose={() => setShot(null)} />
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

class Boundary extends React.Component {
  constructor(p){ super(p); this.state = { hasError:false }; }
  static getDerivedStateFromError(){ return { hasError:true }; }
  render(){
    if (this.state.hasError){
      return (
        <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#080808', color:'#f4f2ee', fontFamily:"'Syne',sans-serif"}}>
          <div style={{textAlign:'center'}}>
            <h1 style={{fontSize:24, fontWeight:800, marginBottom:10}}>Something interrupted the demo</h1>
            <button className="btn btn-primary" onClick={() => window.location.reload()}>↺ Restart Sandbox</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
