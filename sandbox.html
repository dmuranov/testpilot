<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestPilot — Sandbox demo</title>
<meta name="description" content="Watch TestPilot lead a client through a first test, step by step, on a made-up app. No sign-up.">
<link rel="icon" type="image/png" href="/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<style>
  /* The same look as the real chat (first-run.html): keep the two in step. */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080808;color:#f4f2ee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 220px;width:100%;flex:1}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}
  .brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
  .brand span{color:#c8f040}
  .brand .demo{font-size:10px;font-family:monospace;letter-spacing:1px;color:#f59e0b;border:1px solid #f59e0b;border-radius:4px;padding:2px 6px;font-weight:600}
  .signin{font-size:13px;color:#d8d8d8;text-decoration:none;white-space:nowrap}
  .signin:hover{color:#c8f040}
  .chat{display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;padding:13px 16px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;scroll-margin-bottom:200px}
  .msg.tp{background:#0f0f0f;border:1px solid rgba(200,240,64,0.15);align-self:flex-start;border-top-left-radius:3px}
  .msg.me{background:#c8f040;color:#080808;align-self:flex-end;border-top-right-radius:3px;font-weight:600}
  .msg .who{font-size:11px;color:#c8f040;font-family:monospace;letter-spacing:.5px;margin-bottom:4px}
  .msg p+p{margin-top:8px}
  .msg a{color:#c8f040}
  .muted{color:#a8a8a8;font-size:12px}
  code.box{display:block;background:#080808;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;font-family:'SF Mono',Monaco,monospace;font-size:12px;word-break:break-word;white-space:pre-wrap;margin:8px 0;color:#e8e8e8}
  .live{font-family:'SF Mono',Monaco,monospace;font-size:12px;color:#a8a8a8}
  .live div+div{margin-top:3px}
  .reply{position:fixed;left:0;right:0;bottom:0;background:#080808;border-top:1px solid #1d1d1d;padding:12px 16px}
  .reply-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea{flex:1;min-width:0;background:#0f0f0f;border:1px solid rgba(200,240,64,0.25);color:#fff;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;border-radius:8px;-webkit-appearance:none;resize:vertical}
  input:focus,textarea:focus{border-color:#c8f040}
  button{background:#c8f040;color:#080808;font-weight:800;font-size:14px;padding:12px 16px;border:none;cursor:pointer;border-radius:8px;font-family:inherit;touch-action:manipulation}
  button:hover{opacity:.9}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:#e8e8e8;border:1px solid #333;font-weight:600}
  button.ghost:hover{border-color:#c8f040;opacity:1}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .choice{display:flex;gap:10px;align-items:flex-start;background:#080808;border:1px solid #2a2a2a;border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;color:#f4f2ee;font-weight:400;font-size:13px;width:100%}
  .choice:hover{border-color:#c8f040;opacity:1}
  .choice b{display:block;font-size:14px;margin-bottom:2px}
  .choice .done{font-size:11px;color:#c8f040;font-family:monospace}
  .problem{border:1px solid #3a2a00;background:#120d00;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
  .plan{margin-top:10px;border:1px solid rgba(200,240,64,0.5);border-radius:8px;padding:12px}
  @media (max-width:520px){.msg{max-width:96%}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><div>Test<span>Pilot</span></div><div class="demo">DEMO</div></div>
    <a href="/first-run" class="signin">Test my own app →</a>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
</div>
<div class="reply"><div class="reply-in" id="reply"></div></div>

<script>
// The sandbox (2026-11-12): the real chat's conversation, played on a made-up
// app with made-up answers. Nothing here calls the server, opens a site or
// stores what is typed. The visitor plays the client: every question can be
// answered in their own words or with "Use the example".
//
// The made-up app, kept consistent everywhere below:
//   Casa Verde, a restaurant. Pages: Home, Menu, Book a table, My bookings,
//   Gift cards (5 pages, 2 forms, 24 buttons and links). A booking takes a
//   deposit of €5 per guest. Its planted problems:
//   - the booking form forgets the number of guests (summary says 2, deposit €10)
//   - any signed-in customer can open another customer's booking by its number
//   - customers see the staff link "All bookings"
//   - "Download menu (PDF)" leads to a missing page; "Gift cards" does nothing
const APP = { name: 'Casa Verde', url: 'https://casa-verde.example', host: 'casa-verde.example' };
const st = { email: '', builder: 'Lovable', login: '', second: '', done: new Set() };
const $chat = document.getElementById('chat');
const $reply = document.getElementById('reply');
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function say(html) {
  const d = document.createElement('div');
  d.className = 'msg tp';
  d.innerHTML = '<div class="who">TESTPILOT</div>' + html;
  $chat.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}
function me(text) {
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  $chat.appendChild(d);
}
function setReply(html) { $reply.innerHTML = html; const f = $reply.querySelector('input,textarea'); if (f) f.focus(); }
function busy(text) { setReply(`<div class="muted">${esc(text)}</div>`); }
function copy(text, btn) {
  navigator.clipboard?.writeText(text).then(() => { const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = t, 1600); }).catch(() => {});
}

// One question with a text box. The visitor types anything, or takes the example.
let onAnswer = null;
function ask(placeholder, example, next, opts = {}) {
  onAnswer = (v) => { onAnswer = null; me(opts.mask && /\s/.test(v) ? v.replace(/\S+$/, '••••••••') : v); next(v); };
  setReply(`<div class="row"><input id="in" placeholder="${esc(placeholder)}" onkeydown="if(event.key==='Enter')answer()"><button onclick="answer()">Send</button></div>
    <div class="row"><button class="ghost" onclick="answer(true)">Use the example</button></div>
    <div class="muted">Demo: made-up data, nothing is sent anywhere.</div>`);
  ask.example = example;
}
function answer(useExample) {
  if (!onAnswer) return;
  const v = useExample ? ask.example : (document.getElementById('in').value || '').trim();
  if (!v) return;
  onAnswer(v);
}

// Numbered lists, as in the real chat: click an item, type its number, or
// name it in a few words.
let menuItems = [], menuSeq = 0;
function menu(title, items) {
  menuItems = items; const seq = ++menuSeq;
  document.querySelectorAll('.choices button.choice').forEach((b) => { b.disabled = true; });
  say(`${title}<div class="choices">${items.map((it, i) => `<button class="choice" onclick="choose(${i + 1}, ${seq})"><span>${i + 1}.</span><span><b>${esc(it.label)}</b>${esc(it.desc || '')}${it.done ? ' <span class="done">✓ tried</span>' : ''}</span></button>`).join('')}</div>`);
  setReply(`<div class="row"><input id="num" placeholder="Type a number (1–${items.length}), or say it in your own words" onkeydown="if(event.key==='Enter')gotNumber()"><button onclick="gotNumber()">Send</button></div>`);
}
function choose(n, seq) {
  if (seq && seq !== menuSeq) return;
  const it = menuItems[n - 1];
  if (!it) return;
  menuSeq++;   // this list has answered
  document.querySelectorAll('.choices button.choice').forEach((b) => { b.disabled = true; });
  me(`${n}. ${it.label}`); it.act();
}
function gotNumber() {
  const raw = (document.getElementById('num').value || '').trim();
  if (!raw) return;
  if (/^\d+$/.test(raw)) {
    const n = parseInt(raw, 10);
    if (n >= 1 && n <= menuItems.length) return choose(n);
    return say(`<p>Type a number from 1 to ${menuItems.length}.</p>`);
  }
  // Words: yes / no on a two-item list, or a word from one item's name.
  const low = raw.toLowerCase();
  let idx = -1;
  // A word from one item's name first ("skip", "security"); then a plain yes
  // or no, which each list maps itself (yn), because "yes" is not always item 1.
  const words = low.split(/[^a-z0-9]+/).filter((w) => w.length > 3);
  const hits = menuItems.map((it, i) => [words.filter((w) => `${it.label} ${it.desc || ''}`.toLowerCase().includes(w)).length, i]).filter(([n]) => n > 0).sort((a, b) => b[0] - a[0]);
  if (hits.length && (hits.length === 1 || hits[0][0] > hits[1][0])) idx = hits[0][1];
  else if (/^(y|yes|yep|ok|okay|sure|go|go ahead)\b/.test(low)) idx = menuItems.findIndex((it) => it.yn === 'yes');
  else if (/^(n|no|nope|not now)\b/.test(low)) idx = menuItems.findIndex((it) => it.yn === 'no');
  if (idx < 0) { me(raw); document.getElementById('num').value = ''; return say(`<p>In the demo I only follow the list. Pick a number from 1 to ${menuItems.length}.</p><p class="muted">In the real chat you can ask me anything here and I answer.</p>`); }
  choose(idx + 1);
}

// A run: lines that appear one after another in one bubble.
async function live(title, lines, pace = 650) {
  const b = say(`<p>${title}</p><div class="live"></div>`);
  const box = b.querySelector('.live');
  for (const line of lines) {
    await wait(pace);
    const d = document.createElement('div'); d.textContent = line; box.appendChild(d);
    b.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  await wait(pace);
}

// ── the conversation ────────────────────────────────────────
function start() {
  say(`<p>This is a <b>demo</b>. You play a client, I test a made-up restaurant app called <b>${APP.name}</b>. Nothing you type is sent anywhere, and every question has a <b>Use the example</b> button.</p>`);
  say('<p>Hi! I\'m TestPilot. I test your app the way a customer would use it, then tell you in plain words what\'s broken and how to fix it.</p><p>First, what\'s your email?</p>');
  ask('you@company.com', 'maria@casa-verde.example', (v) => { st.email = v; askUrl(); });
}
function askUrl() {
  say('<p>Paste the link to your app: the one your customers open.</p>');
  ask('https://your-app.com', APP.url, () => {
    say(`<p class="muted">In the demo I always test ${APP.url}, whatever you paste.</p>`);
    menu('<p>Which builder did you make it with? I write the fixes in the words your builder understands.</p>', [
      ...['Base44', 'Lovable', 'Bolt', 'Replit', 'v0'].map((b) => ({ label: b, act: () => { st.builder = b; askProof(); } })),
      { label: 'Something else / my own code', act: () => { st.builder = 'your builder'; askProof(); } },
    ]);
  });
}
function askProof() {
  const where = st.builder === 'your builder' ? 'your app’s code' : `${st.builder}’s AI chat`;
  say(`<p>Before I test anything, I check that <b>${APP.host}</b> is yours. Paste this one line into ${esc(where)} and publish:</p>
    <code class="box">Add this tag inside the &lt;head&gt; of every page: &lt;meta name="testpilot-verify" content="tp-demo-4f7a91"&gt;</code>
    <p class="muted">That is all: one small invisible tag. It proves nobody else can run tests on your app.</p>`);
  setReply(`<div class="row"><button onclick="checkProof()">Done, check it</button></div><div class="muted">Demo: just press the button.</div>`);
}
async function checkProof() {
  me('Done, check it'); busy('Looking for the tag on your site…');
  await wait(1400);
  say(`<p>✓ Found it. <b>${APP.host}</b> is verified as yours.</p>`);
  menu('<p>Does your app have a login?</p>', [
    { label: 'Yes, it has a login', yn: 'yes', act: askLogin },
    { label: 'No, it\'s public', yn: 'no', act: () => { say('<p class="muted">In the demo the app does have a login (its "My bookings" page needs one), so I carry on with the example test account.</p>'); st.login = 'test.customer@casa-verde.example'; learn(); } },
  ]);
}
function askLogin() {
  say('<p>Please give me a <b>test account</b>, not your real one: I click around like a customer would.</p><p class="muted">Type the email and the password with a space between them.</p>');
  ask('test login email and password', 'test.customer@casa-verde.example demo-password', (v) => { st.login = v.split(/\s+/)[0]; learn(); }, { mask: true });
}
async function learn() {
  busy('Looking around your app… usually one to two minutes. In the demo: a few seconds.');
  await live(`Looking around <b>${APP.host}</b>${st.login ? `, signed in as ${esc(st.login)}` : ''}…`, [
    'Home: opening hours, "Book a table", "Download menu (PDF)"',
    'Menu: 3 sections, 18 dishes',
    'Book a table: a form with date, time, guests, name, phone',
    'My bookings: 1 booking, with "Cancel booking"',
    'Gift cards: 1 button',
    'Done: 5 pages, 2 forms, 24 buttons and links',
  ]);
  choices(true);
}
function choices(first) {
  const item = (key, label, desc, act) => ({ label, desc, done: st.done.has(key), act });
  menu(`<p>${first ? `I looked at your app. You have <b>1 free test</b>. Which one do you want to run?</p><p class="muted">In the demo you can try them all, one after another.` : 'Which test do you want to see next?'}</p>`, [
    item('flow', 'Book a table for four', 'Flow Test, suggested from what I saw: a customer books a table and I check the summary.', flowTest),
    item('checkout', 'Checkout & Booking Test', 'The booking up to the deposit payment. I stop before anything is paid.', checkoutTest),
    item('multirole', 'Multi-Role', 'The same pages as two different users: staff and a customer.', multiRole),
    item('security', 'Security Test', 'Can one customer see another customer’s booking?', security),
    item('sweep', 'Check Everything', 'I click every button and link and tell you which ones are broken.', sweep),
  ]);
}
function report(key, steps, problems, fix) {
  st.done.add(key);
  if (!problems.length) say(`<p><b>Everything in this test worked.</b> ✅ ${steps} steps, no problems found.</p>`);
  else {
    say(`<p>I found <b>${problems.length} problem${problems.length === 1 ? '' : 's'}</b>:</p>${problems.map((p, i) => `<div class="problem"><b>${i + 1}.</b> ${p}</div>`).join('')}`);
    const where = st.builder === 'your builder' ? 'your builder’s AI chat' : `${st.builder}’s AI chat`;
    const id = 'fix-' + key;
    say(`<p>The fix${problems.length === 1 ? '' : 'es'}. Paste ${problems.length === 1 ? 'it' : 'this'} into ${esc(where)}:</p><code class="box" id="${id}">${esc(fix)}</code><button class="ghost" onclick="copy(document.getElementById('${id}').textContent,this)">Copy the fix</button>`);
  }
  whatNext();
}
function whatNext() {
  const left = 5 - st.done.size;
  menu('<p>What next?</p>', [
    ...(left ? [{ label: 'Try another test', desc: `${left} more in the demo.`, act: () => choices(false) }] : []),
    { label: 'Test my own app', desc: 'The same conversation on your real app. The first test is free.', act: () => { location.href = '/first-run'; } },
  ]);
}

// ── Flow Test ───────────────────────────────────────────────
function flowTest() {
  say('<p><b>Flow Test.</b> I go through one flow the way a customer would, step by step, and tell you in plain words where it breaks and how to fix it.</p><p>Here is what I would test:</p><code class="box">A customer opens "Book a table", picks Saturday at 20:00 for 4 guests, fills in a name and a phone number and presses "Continue". The summary must say "Table for 4, Saturday, 20:00".</code>');
  menu('<p>Shall I run it?</p>', [
    { label: 'Run it', yn: 'yes', act: flowRun },
    { label: 'I will describe it myself', desc: 'In the real chat you can describe any flow in your own words.', act: () => {
      say('<p>Describe the flow: what a customer does, step by step, and what should be true at the end.</p>');
      ask('A customer…', 'A customer books a table for 4 on Saturday at 20:00 and the summary shows 4 guests.', () => { say('<p class="muted">In the demo I run the booking flow, whatever you describe.</p>'); flowRun(); });
    } },
  ]);
}
async function flowRun() {
  busy('Testing… usually two to four minutes. In the demo: a few seconds.');
  await live('Testing your app now, step by step…', [
    'Step 1: open "Book a table" → ✅ the form is there',
    'Step 2: date → Saturday ✅',
    'Step 3: time → 20:00 ✅',
    'Step 4: guests → 4 ✅',
    'Step 5: name and phone → filled in ✅',
    'Step 6: press "Continue" → the summary opens ✅',
    'Step 7: check the summary → ❌ it says "Table for 2, Saturday, 20:00"',
    'Complete: 6 passed, 0 retries, 1 confirmed problem',
  ]);
  report('flow', 7,
    ['The booking summary says <b>"Table for 2"</b> although 4 guests were chosen. The date and the time are right. A customer who books for four gets a table for two.'],
    'On the "Book a table" page, when I choose 4 guests and press "Continue", the summary page shows "Table for 2" instead of "Table for 4". The number of guests chosen in the form is not carried over to the summary (it falls back to the default of 2). Please fix it so the summary and the saved booking use the number of guests the customer chose. Change nothing else.');
}

// ── Checkout & Booking ──────────────────────────────────────
function checkoutTest() {
  say('<p><b>Checkout &amp; Booking Test.</b> I go through a purchase or a booking up to the payment step and check every screen on the way. I stop before anything is paid.</p><p>Here is what I would test:</p><code class="box">A customer books a table for 4 on Saturday at 20:00 and continues to the deposit. The deposit is €5 per guest, so the last screen before paying must show "Deposit: €20.00".</code>');
  menu('<p>Shall I run it?</p>', [{ label: 'Run it', yn: 'yes', act: checkoutRun }, { label: 'Not now', yn: 'no', act: () => choices(false) }]);
}
async function checkoutRun() {
  busy('Testing… I stop before the payment.');
  await live('Testing your app now, step by step…', [
    'Step 1: open "Book a table" → ✅',
    'Step 2: Saturday, 20:00, 4 guests, name and phone → ✅',
    'Step 3: press "Continue" → the summary opens ✅',
    'Step 4: press "Pay deposit" → the payment screen opens ✅',
    'Step 5: check the amount → ❌ it says "Deposit: €10.00"',
    'Stopped here: the next button is "Pay €10.00". I never press it.',
    'Complete: 4 passed, 0 retries, 1 confirmed problem',
  ]);
  report('checkout', 5,
    ['The payment screen asks for a deposit of <b>€10.00</b>. At €5 per guest, a table for 4 should cost <b>€20.00</b>. The deposit is worked out for 2 guests, the same wrong number the booking summary shows.'],
    'On the deposit payment screen for a table booking, the amount shows "Deposit: €10.00" for a booking of 4 guests. The deposit is €5 per guest, so it should be €20.00. It is calculated from the default of 2 guests instead of the number the customer chose. Please use the chosen number of guests for the summary and for the deposit. Change nothing else.');
}

// ── second account, for Multi-Role and Security ─────────────
function needSecond(why, example, next) {
  if (st.second) return next();
  say(`<p>${why}</p><p class="muted">Type the email and the password with a space between them.</p>`);
  ask('second test account email and password', example, (v) => { st.second = v.split(/\s+/)[0]; next(); }, { mask: true });
}

// ── Multi-Role ──────────────────────────────────────────────
function multiRole() {
  say('<p><b>Multi-Role.</b> I run the same flow as two different users and check that each one sees and can do only what they should.</p>');
  if (!st.login) st.login = 'test.customer@casa-verde.example';
  st.second = '';
  needSecond(`Account 1 is your customer test account. Which <b>staff account</b> should I use as account 2?`, 'test.staff@casa-verde.example demo-password', () => {
    say('<p>What should the customer <b>not</b> see or do that staff can? A few words are enough.</p>');
    ask('The customer must not…', 'only staff may see the list of all bookings', (v) => {
      say(`<p>Here is what I would test:</p><code class="box">Both accounts open the menu of the app and then "My bookings". Staff must see the link "All bookings" and the list of every booking. The customer must see only their own booking and no "All bookings" link.</code>`);
      menu('<p>Shall I run it?</p>', [{ label: 'Run it', yn: 'yes', act: multiRun }, { label: 'Not now', yn: 'no', act: () => choices(false) }]);
    });
  });
}
async function multiRun() {
  busy('Testing both accounts at the same time…');
  await live('Testing your app now, as two accounts…', [
    '[Staff] open the menu → ✅ "All bookings" is there',
    '[Staff] open "All bookings" → ✅ 12 bookings listed',
    '[Customer] open "My bookings" → ✅ 1 booking, their own',
    '[Customer] open the menu → ❌ "All bookings" is there too',
    '[Customer] open "All bookings" → ❌ 12 bookings listed, with names and phone numbers',
    'Complete: 3 passed, 0 retries, 1 confirmed problem',
  ]);
  report('multirole', 5,
    ['<b>Customer:</b> the menu shows the staff link <b>"All bookings"</b>, and it opens: the customer sees all 12 bookings with the guests’ names and phone numbers. Staff sees the same page, as intended.'],
    'In my app, a signed-in customer can see the menu link "All bookings" and open that page, which lists every booking with guest names and phone numbers. Only staff accounts should see this link and be able to open this page. Please hide the link for customers and block the page itself for anyone who is not staff (not only hide it). Change nothing else.');
}

// ── Security Test ───────────────────────────────────────────
function security() {
  say('<p><b>Security Test.</b> I check whether one customer can reach another customer’s data, and I look for the common weak spots. I only read: nothing is changed or deleted.</p>');
  if (!st.login) st.login = 'test.customer@casa-verde.example';
  st.second = '';
  needSecond('To see whether one customer can reach another customer’s data, I sign in as a <b>second customer account</b> and try to open the first one’s booking.', 'second.customer@casa-verde.example demo-password', securityRun);
}
async function securityRun() {
  busy('Checking… I only read, nothing is changed.');
  await live('Checking your app…', [
    'Signed in as account 1: its booking is number 1042',
    'Signed in as account 2: its booking is number 1057',
    'As account 2, open booking 1057 → ✅ allowed, it is theirs',
    'As account 2, open booking 1042 → ❌ it opens: name, phone, date and time of account 1',
    'Signed out, open booking 1042 → ✅ refused',
    'Sign-in page: 20 wrong passwords in a row → ❌ never slowed down',
    'Done: 4 checks, 2 problems',
  ]);
  report('security', 4,
    ['<b>Serious.</b> A signed-in customer can open <b>another customer’s booking</b> by changing the number in the address (1057 → 1042). They see that guest’s name, phone number, date and time.',
     '<b>Worth fixing.</b> Someone can try many passwords in a row on your sign-in page without being slowed down.'],
    'Two security problems in my app, please fix both and change nothing else:\n1. A signed-in customer can open another customer\'s booking by changing the booking number in the address (for example /bookings/1042). The app only checks that someone is signed in. It must also check that the booking belongs to the signed-in customer, on the server or in the database rules, and refuse otherwise.\n2. The sign-in page accepts unlimited wrong passwords. Please limit failed sign-in attempts, for example 5 per minute per email.');
}

// ── Check Everything ────────────────────────────────────────
function sweep() {
  say('<p><b>Check Everything.</b> I click every button and link I can find and tell you which ones are broken or do nothing. Before a click that could order, send or delete something, I ask you.</p>');
  menu('<p>It usually takes three to eight minutes. In the demo: a few seconds. Shall I start?</p>', [{ label: 'Start', yn: 'yes', act: sweepRun }, { label: 'Not now', yn: 'no', act: () => choices(false) }]);
}
async function sweepRun() {
  busy('Clicking everything…');
  await live('Clicking every button and link I can find…', [
    '✅ "Book a table" — works',
    '✅ "Menu" — works',
    '❌ "Download menu (PDF)" — opens a page that says "Page not found"',
    '✅ 9 more on Home and Menu — work',
    '⚪ "Gift cards → Buy a gift card" — nothing happened, twice',
    '✅ 10 more on Book a table and My bookings — work',
  ], 550);
  menu('<p>⚠ Should I click <b>"Cancel booking"</b> on My bookings? It looks like it cancels a real booking, and I cannot take that back.</p>', [
    { label: 'Skip it', yn: 'no', act: () => sweepEnd(false) },
    { label: 'Click it anyway', yn: 'yes', act: () => sweepEnd(true) },
  ]);
}
async function sweepEnd(clicked) {
  busy('Finishing…');
  await wait(900);
  say(clicked
    ? '<p class="muted">Demo: I pretend I clicked it. It asked "Cancel this booking?" first, which is how it should be, so I pressed "Keep it".</p>'
    : '<p class="muted">Skipped. I did not touch it.</p>');
  st.done.add('sweep');
  say(`<p>I clicked <b>24 buttons and links</b>: ${clicked ? 22 : 21} work, 1 broken, 1 did nothing${clicked ? '' : ', 1 skipped'}.</p>
    <div class="problem"><b>1.</b> <b>"Download menu (PDF)"</b> on Home opens a page that says "Page not found".</div>
    <div class="problem"><b>2.</b> <b>"Buy a gift card"</b> on Gift cards does nothing when clicked. I clicked it twice and nothing on the page changed.</div>`);
  const where = st.builder === 'your builder' ? 'your builder’s AI chat' : `${st.builder}’s AI chat`;
  say(`<p>Paste this into ${esc(where)}:</p><code class="box" id="fix-sweep">An automated tester clicked every button and link in my app and found these problems:
1. On the Home page, "Download menu (PDF)" opens a page that says "Page not found". Please link it to the menu PDF, or remove the button if there is no PDF.
2. On the Gift cards page, the button "Buy a gift card" does nothing at all when clicked: no page opens and nothing changes.
Please fix them so each one does what its label says, and change nothing else.</code><button class="ghost" onclick="copy(document.getElementById('fix-sweep').textContent,this)">Copy the fix</button>`);
  whatNext();
}

start();
</script>
