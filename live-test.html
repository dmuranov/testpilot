<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live test — TestPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #080808; color: #f0f0f0;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px;
    border-bottom: 1px solid #1f1f1f;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; }
  .title .id { color: #777; font-family: 'DM Mono', monospace; font-weight: 400; font-size: 11px; margin-left: 8px; }
  .badge {
    font-size: 10px; padding: 3px 8px; border-radius: 2px; font-weight: 700;
    border: 1px solid;
  }
  .badge.running { color: #c8f040; border-color: rgba(200,240,64,0.4); background: rgba(200,240,64,0.08); }
  .badge.done { color: #22c55e; border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.08); }
  .badge.error { color: #ef4444; border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }
  .stream {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    background: #0a0a0a;
  }
  .step {
    padding: 6px 0; border-bottom: 1px solid #141414;
    display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: flex-start;
    word-break: break-word;
  }
  .step:last-child { border-bottom: none; }
  .icon { font-size: 12px; line-height: 1.4; }
  .msg { line-height: 1.5; color: #ddd; }
  .step.pass .icon { color: #22c55e; }
  .step.fail .icon { color: #ef4444; }
  .step.error .icon { color: #ef4444; }
  .step.bug .icon { color: #ef4444; }
  .step.retry .icon { color: #eab308; }
  .step.info .icon { color: #888; }
  .step.done .icon { color: #c8f040; }
  .step.summary .icon { color: #c8f040; }
  .step.summary .msg { color: #c8f040; font-weight: 600; }
  .empty {
    color: #555; padding: 24px; text-align: center; font-style: italic;
  }
  .footer {
    padding: 8px 14px; border-top: 1px solid #1f1f1f;
    font-size: 10px; color: #555; flex-shrink: 0;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
</style>
<!-- data-stall-ms: this whole page IS a /api/test/:id/stream viewer, where a
     single legitimate step can take ~100s (server.js, runAgentTest timeout
     comment) — the 90s script default would false-positive on a normal run. -->
<!-- NOT deferred, unlike every other page: the inline script below calls
     connect() -> new EventSource(...) immediately at parse time (this page's
     whole purpose is to auto-connect on load), which races a deferred
     signal.js — connect() would run first and get the native, unwrapped
     EventSource, silently disabling stall/CLOSED detection for this page's
     only stream. Found by actually running it: the connection sat at
     readyState CONNECTING for 10+ minutes with zero bytes ever received
     (confirmed via curl too — a real, unrelated server-side quirk for a
     nonexistent testId) and stream_stalled never fired, on a fake testId
     that would never emit a real 'done'/'summary' event either way. -->
<script src="/signal.js" data-stall-ms="180000"></script>
<script src="/support-widget.js" defer></script>
</head>
<body>
<header>
  <div class="title">▶ Live test <span class="id" id="test-id"></span></div>
  <div class="badge running" id="status">⏳ Connecting…</div>
</header>
<div class="stream" id="stream">
  <div class="empty" id="empty">Waiting for events…</div>
</div>
<div class="footer">Live stream from testpilotapp.dev — auto-reconnects on drops.</div>
<script>
(function () {
  // testId comes from the URL path: /live-test/<testId>
  const parts = window.location.pathname.split('/').filter(Boolean);
  const testId = parts[parts.length - 1] || '';
  if (!testId || parts[0] !== 'live-test') {
    document.getElementById('status').textContent = '❌ Missing testId';
    document.getElementById('status').className = 'badge error';
    return;
  }
  document.getElementById('test-id').textContent = testId.substring(0, 12) + '…';

  const stream = document.getElementById('stream');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');

  const ICONS = {
    pass: '✅', fail: '❌', retry: '🔄', bug: '🐛',
    info: 'ℹ️', done: '🏁', error: '💥', summary: '📊',
  };

  let connected = false;
  function setStatus(text, cls) {
    status.textContent = text;
    status.className = 'badge ' + cls;
  }

  function escape(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function append(data) {
    if (empty) { empty.remove(); }
    const div = document.createElement('div');
    div.className = 'step ' + (data.type || 'info');
    const icon = ICONS[data.type] || 'ℹ️';
    div.innerHTML =
      '<div class="icon">' + icon + '</div>' +
      '<div class="msg">' + escape(data.message || data.detail || JSON.stringify(data)) + '</div>';
    stream.appendChild(div);
    stream.scrollTop = stream.scrollHeight;
  }

  function connect() {
    const events = new EventSource('/api/test/' + encodeURIComponent(testId) + '/stream');
    events.onopen = () => {
      if (!connected) {
        connected = true;
        setStatus('⏳ Running…', 'running');
      }
    };
    events.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        // Heartbeat = still active during a slow step. Reflect it in the status
        // badge instead of appending a step line (keeps the log clean and the
        // SSE connection alive).
        if (data.type === 'heartbeat') {
          setStatus('⏳ ' + (data.message || 'Still working…'), 'running');
          return;
        }
        append(data);
        // Real progress resumed — clear any lingering "still working" status.
        if (data.type === 'pass' || data.type === 'retry' || data.type === 'info') {
          setStatus('⏳ Running…', 'running');
        }
        if (data.type === 'summary' || data.type === 'done') {
          setStatus('🏁 Done', 'done');
          events.close();
        }
        if (data.type === 'error') {
          setStatus('💥 Error', 'error');
        }
      } catch { /* partial chunk */ }
    };
    events.onerror = () => {
      if (events.readyState === EventSource.CLOSED) {
        setStatus('⚠ Disconnected', 'error');
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
