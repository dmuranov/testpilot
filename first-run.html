<!DOCTYPE html>
<html lang="en">
<head>

<title>TestPilot — First run</title>
<link rel="icon" type="image/png" href="/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080808;color:#f4f2ee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 200px;width:100%;flex:1}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .brand{font-size:20px;font-weight:800}
  .brand span{color:#c8f040}
  .signin{font-size:13px;color:#d8d8d8;text-decoration:none}
  .signin:hover{color:#c8f040}
  .chat{display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;padding:13px 16px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;scroll-margin-bottom:180px}
  .msg.tp{background:#0f0f0f;border:1px solid rgba(200,240,64,0.15);align-self:flex-start;border-top-left-radius:3px}
  .msg.me{background:#c8f040;color:#080808;align-self:flex-end;border-top-right-radius:3px;font-weight:600}
  .msg.err{border-color:#f59e0b}
  .msg .who{font-size:11px;color:#c8f040;font-family:monospace;letter-spacing:.5px;margin-bottom:4px}
  .msg p+p{margin-top:8px}
  .msg a{color:#c8f040}
  .muted{color:#a8a8a8;font-size:12px}
  code.box{display:block;background:#080808;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;font-family:'SF Mono',Monaco,monospace;font-size:12px;word-break:break-word;white-space:pre-wrap;margin:8px 0;color:#e8e8e8}
  .live{font-family:'SF Mono',Monaco,monospace;font-size:12px;color:#a8a8a8}
  .reply{position:fixed;left:0;right:0;bottom:0;background:#080808;border-top:1px solid #1d1d1d;padding:12px 16px}
  .reply-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea{flex:1;min-width:0;background:#0f0f0f;border:1px solid rgba(200,240,64,0.25);color:#fff;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;border-radius:8px;-webkit-appearance:none;resize:vertical}
  input:focus,textarea:focus{border-color:#c8f040}
  button{background:#c8f040;color:#080808;font-weight:800;font-size:14px;padding:12px 16px;border:none;cursor:pointer;border-radius:8px;font-family:inherit;touch-action:manipulation}
  button:hover{opacity:.9}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:#e8e8e8;border:1px solid #333;font-weight:600}
  button.ghost:hover{border-color:#c8f040;opacity:1}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .choice{display:flex;gap:10px;align-items:flex-start;background:#080808;border:1px solid #2a2a2a;border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;color:#f4f2ee;font-weight:400;font-size:13px;width:100%}
  .choice:hover,.choice.on{border-color:#c8f040;opacity:1}
  .choice b{display:block;font-size:14px;margin-bottom:2px}
  .choice .tag{font-size:11px;color:#f59e0b;font-family:monospace}
  .choice.locked{opacity:.55;cursor:default}
  .divider{font-size:11px;color:#777;font-family:monospace;text-align:center;margin:12px 0 2px}
  .problem{border:1px solid #3a2a00;background:#120d00;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
  .problem.locked{border-color:#2a2a2a;background:#0b0b0b;color:#a8a8a8}
  .plan{margin-top:10px;border:1px solid rgba(200,240,64,0.5);border-radius:8px;padding:12px}
  .plan b{font-size:20px}
  @media (max-width:520px){.msg{max-width:96%}}
</style>

<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Test<span>Pilot</span></div>
    <a href="#" class="signin" id="signin-link" onclick="askSignIn();return false">Sign in →</a>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
</div>
<div class="reply"><div class="reply-in" id="reply"></div></div>

<script src="/attrib.js"></script>
<script src="/live-login.js"></script>
<!-- data-stall-ms: the test stream can legitimately go ~100s between events
     (runAgentTest step timeout), well past signal.js's 90s default. -->
<script src="/signal.js" defer data-stall-ms="180000"></script>
<script src="/support-widget.js" defer></script>
<script>
// Chat first-run (2026-10-30): one question at a time, in this order —
// email, app link, builder, ownership proof, login, crawl, pick a test, run,
// plain-words report, the first problem's fix prompt. Every step calls the
// same endpoints the dashboard uses; nothing here is a separate engine.
const TERMS_VERSION = '1.0';
const st = { email: '', url: '', origin: '', platform: 'other', platformName: '', appId: null, appEmail: '', appPw: '', testId: null, verification: null,
  plan: 'free', freeUsed: false, savedLogin: null, apps: [], lastScenario: '', menu: [], afterCreds: null, afterSave: null };
const PLATFORMS = [['base44', 'Base44'], ['lovable', 'Lovable'], ['bolt', 'Bolt'], ['replit', 'Replit'], ['v0', 'v0'], ['other', 'Something else / my own code']];

const $chat = document.getElementById('chat');
const $reply = document.getElementById('reply');
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Login help during a crawl or a test (live-login.js): the code prompt lands
// at the bottom of the chat, the takeover opens over the page. True when ev
// was one of those events.
const liveIds = new Set();
// The run ended: nothing may stay over the chat (an open takeover, an
// unanswered offer) and an unanswered code box can no longer be used.
function endLive() {
  for (const id of liveIds) {
    try { closeLiveOverlay(id); } catch (e) {}
    const box = document.getElementById('twofa-prompt-' + id);
    if (box && box.querySelector('input')) box.innerHTML = '<div class="muted">This code request has ended.</div>';
  }
  liveIds.clear();
}
function liveEvent(ev, runId) {
  const id = ev.runId || runId;
  if (!id) return false;
  if (ev.type === 'awaiting_2fa') {
    liveIds.add(id);
    document.getElementById('tp-live-host')?.removeAttribute('id');
    const host = document.createElement('div'); host.id = 'tp-live-host';
    $chat.appendChild(host);
    show2faPrompt(id, ev.message);
    host.scrollIntoView({ block: 'end' });
    return true;
  }
  if (ev.type === 'awaiting_oauth_handoff') { liveIds.add(id); showOAuthHandoffPrompt(id, ev.message, ev.hostname, ev.offerId); return true; }
  if (ev.type === 'live_view_ready') { openLiveView(id, ev.hostname, ev.offerId); return true; }
  if (ev.type === 'live_frame') { renderLiveFrame(id, ev.data); return true; }
  return false;
}
function say(html, cls) {
  const d = document.createElement('div');
  d.className = 'msg tp' + (cls ? ' ' + cls : '');
  d.innerHTML = '<div class="who">TESTPILOT</div>' + html;
  $chat.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}
function me(text) {
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  $chat.appendChild(d);
}
function setReply(html) { $reply.innerHTML = html; const f = $reply.querySelector('input,textarea'); if (f) f.focus(); }
function step(name, detail) {
  fetch('/api/funnel/step', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ step: name, detail: detail || '' }) }).catch(() => {});
  // A step that got through means an earlier error is behind us: close the
  // "Something went wrong" helper if it is still open and untouched.
  if (name === 'learned' || name === 'report' || name === 'verified') window.dispatchEvent(new Event('tp_help_resolved'));
}
async function postJson(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}
function netErr(e) {
  return (e && e.name === 'TypeError') ? 'I could not reach TestPilot. Check your connection and try again.' : 'Something went wrong on our side, not in your app. Please try again.';
}
function copy(text, btn) {
  navigator.clipboard?.writeText(text).then(() => { if (btn) { const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = t, 1600); } }).catch(() => {});
}

// ── 1. email ──────────────────────────────────────────────
function askEmail() {
  say('<p>Hi! I\'m TestPilot. I test your app the way a customer would use it, then tell you in plain words what\'s broken and how to fix it.</p><p>First, what\'s your email?</p>');
  setReply(`<div class="row"><input id="in" type="email" inputmode="email" autocomplete="email" placeholder="you@company.com" onkeydown="if(event.key==='Enter')gotEmail()"><button onclick="gotEmail()">Send</button></div>
    <div class="muted">By continuing you accept the <a href="/terms.html" target="_blank" style="color:#c8f040">Terms</a> and <a href="/privacy.html" target="_blank" style="color:#c8f040">Privacy Policy</a>.</div>`);
}
function gotEmail() {
  const v = document.getElementById('in').value.trim().toLowerCase();
  if (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return say('<p>That doesn\'t look like an email address. Try again?</p>', 'err');
  st.email = v; me(v); step('email');
  askUrl();
}

// ── 2. app link ───────────────────────────────────────────
// Editor / preview links are the most common wrong answer: the crawler can't
// use them, and the ownership proof has to sit on the live site.
function editorLink(u) {
  return /(^|\.)base44\.com\/apps\/|lovable\.dev\/projects|bolt\.new\/~|stackblitz\.com|replit\.com\/@|v0\.dev\/chat|v0\.app\/chat/i.test(u);
}
function askUrl() {
  say('<p>Paste the link to your app: the one your customers open.</p>');
  setReply(`<div class="row"><input id="in" type="url" inputmode="url" autocomplete="url" placeholder="https://your-app.com" onkeydown="if(event.key==='Enter')gotUrl()"><button onclick="gotUrl()">Send</button></div>`);
}
async function gotUrl() {
  const input = document.getElementById('in');
  const v = input.value.trim();
  if (!v) return;
  if (editorLink(v)) return say('<p>That looks like your <b>editor</b> link. I need the link your customers open, the published one. In your builder, look for <b>Publish</b> or <b>Share</b> and copy the live address.</p>', 'err');
  me(v); setReply('<div class="muted">Checking…</div>');
  let attrib = (window.tpAttribution && window.tpAttribution.first) || null;
  if (!attrib) { try { attrib = JSON.parse(localStorage.getItem('tp_attrib') || 'null'); } catch (e) {} }
  try {
    const { res, data } = await postJson('/api/funnel/start', { userEmail: st.email, url: v, source: attrib?.source || '', medium: attrib?.medium || '', campaign: attrib?.campaign || '' });
    if (!res.ok || !data.ok) {
      if (data.code === 'FREE_RUN_USED' || data.code === 'APP_SLOT_LIMIT') {
        say(`<p>${esc(data.error)}</p><p>The free test covers your first app. Sign in to see your apps and reports here, or get the €15/month plan for unlimited apps.</p>`, 'err');
        return setReply(`<div class="row"><button onclick="sendSignInLink(st.email)">Email me a sign-in link</button></div>`);
      }
      if (data.code === 'URL_IS_LOGIN_PAGE' && data.suggestedUrl) {
        say(`<p>That's your app's sign-in page. I'll start from <b>${esc(data.suggestedUrl)}</b> instead. Press Send.</p>`);
        setReply(`<div class="row"><input id="in" type="url" value="${esc(data.suggestedUrl)}" onkeydown="if(event.key==='Enter')gotUrl()"><button onclick="gotUrl()">Send</button></div>`);
        return;
      }
      say(`<p>${esc(data.error || 'I could not open that link.')} Check it opens in a private browser window, then paste it again.</p>`, 'err');
      return askUrlAgain();
    }
    st.url = data.app.url; step('url', st.url);
    postJson('/api/auth/accept-terms', { version: TERMS_VERSION }).catch(() => {});
    askPlatform();
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); askUrlAgain(); }
}
function askUrlAgain() {
  setReply(`<div class="row"><input id="in" type="url" inputmode="url" placeholder="https://your-app.com" onkeydown="if(event.key==='Enter')gotUrl()"><button onclick="gotUrl()">Send</button></div>`);
}

// ── 3. builder ────────────────────────────────────────────
function askPlatform() {
  say('<p>What did you build it with? I\'ll word my instructions and fixes for that tool.</p>');
  setReply(`<div class="row">${PLATFORMS.map(([k, n]) => `<button class="ghost" onclick="gotPlatform('${k}')">${esc(n)}</button>`).join('')}</div>`);
}
function gotPlatform(k) {
  st.platform = k; st.platformName = (PLATFORMS.find((p) => p[0] === k) || [])[1] || '';
  me(st.platformName); step('platform', k);
  try { localStorage.setItem('tp_platform_' + (st.url || ''), k); } catch (e) {}   // remembered for this app's later fixes
  askVerify();
}

// ── 4. ownership proof ────────────────────────────────────
function verifyMessage(v) {
  return `Add exactly this line inside the <head> of index.html, change nothing else, then publish the app: ${v.metaTag}`;
}
async function askVerify() {
  setReply('<div class="muted">One moment…</div>');
  try {
    const { res, data } = await postJson('/api/verify/url', { url: st.url });
    if (!res.ok) { say(`<p>${esc(data.error || 'I could not prepare the check.')}</p>`, 'err'); return askUrlAgain(); }
    st.origin = data.origin; st.verification = data;
    if (data.verified) { say(`<p>${esc(data.origin)} is already verified as yours. 👍</p>`); step('verified', 'already'); return askLogin(); }
    step('verify_shown');
    const own = st.platform === 'other';
    say(`<p>Before I test, I need to know <b>${esc(data.origin + (data.folder || ''))}</b> is yours. I only test apps their owner has verified. It's a one-time step.</p>
      ${data.folder
        ? `<p>Your app is in the folder <code>${esc(data.folder)}</code>, so the proof goes there: publish a file at <code>${esc(data.filePath)}</code> containing only:</p><code class="box">${esc(data.fileBody)}</code>
           <button class="ghost" onclick="copy(st.verification.fileBody,this)">Copy the code</button>
           <p class="muted">A file named <code>${esc(data.filePath.split('/').pop())}</code> next to your app's index.html.</p>`
        : own
        ? `<p>Add this line inside the <code>&lt;head&gt;</code> of your <code>index.html</code>, then publish:</p><code class="box">${esc(data.metaTag)}</code>
           <button class="ghost" onclick="copy(st.verification.metaTag,this)">Copy the tag</button>
           <p class="muted">Or publish a file at <code>${esc(data.filePath)}</code> containing only <code>${esc(data.fileBody)}</code>.</p>`
        : `<p>Paste this message into ${esc(st.platformName)}'s AI chat:</p><code class="box">${esc(verifyMessage(data))}</code>
           <button class="ghost" onclick="copy(verifyMessage(st.verification),this)">Copy the message</button>
           ${st.platform === 'base44' ? '<p class="muted">Or by hand in Base44: dashboard → Code tab → index.html, paste the tag inside &lt;head&gt;.</p>' : ''}`}
      <p>When your app is published again, press <b>Check</b>.</p>`);
    setReply(`<div class="row"><button onclick="checkVerify()">Check</button></div>`);
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); setReply(`<div class="row"><button onclick="askVerify()">Try again</button></div>`); }
}
async function checkVerify() {
  me("Check"); setReply('<div class="muted">Looking for the tag…</div>');
  try {
    const { res, data } = await postJson('/api/verify/url', { url: st.url, check: true });
    if (res.ok && data.verified) { say('<p>Verified, thanks! ✅</p>'); step('verified'); return askLogin(); }
    const why = !res.ok ? (data.error || 'The check did not work.')
      : data.reason === 'other_token' ? 'Your app has a TestPilot tag, but with a different code (maybe from another email). Ask the AI chat to replace the old tag with the one above, then publish.'
      : data.reason === 'unreachable' ? `I couldn't open ${data.origin}. Check the app is published and public.`
      : `I don't see the tag on ${data.origin} yet. Did your builder publish the change? It can take a minute after publishing.`;
    say(`<p>${esc(why)}</p>`, 'err');
    setReply(`<div class="row"><button onclick="checkVerify()">Check again</button></div>`);
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); setReply(`<div class="row"><button onclick="checkVerify()">Check again</button></div>`); }
}

// ── 5. login ──────────────────────────────────────────────
function askLogin() {
  say('<p>Does someone need to log in to use your app?</p>');
  setReply(`<div class="row"><button class="ghost" onclick="gotNoLogin()">No, it's public</button><button class="ghost" onclick="askCreds()">Yes, it has a login</button></div>`);
}
function gotNoLogin() { me('No, it\'s public'); step('login', 'none'); learn(); }
// One login form (askCredsNow); here with the client's "Yes" echoed first.
function askCreds() { me('Yes, it has a login'); askCredsNow(); }
function gotCreds() {
  const e = document.getElementById('ae').value.trim(), p = document.getElementById('ap').value;
  if (!e || !p) return say('<p>I need both the email and the password.</p>', 'err');
  st.appEmail = e; st.appPw = p; me(e + ' · ••••••'); step('login', 'creds');
  // Asked for in the middle of something (an app picked from the list, Keep
  // watching): offer to save it, then carry on there. Otherwise it is for the
  // first crawl, and the save offer comes once the app is known.
  const next = st.afterCreds; st.afterCreds = null;
  if (next) return askSaveLogin(next);
  learn();
}

// ── 6. crawl ──────────────────────────────────────────────
async function learn() {
  setReply('<div class="muted">Looking around your app… this takes about two minutes.</div>');
  const bubble = say('<p>Looking around your app to see what\'s there…</p><p class="live" id="learn-live">starting</p>');
  const live = bubble.querySelector('#learn-live');
  try {
    const res = await fetch('/api/learn', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: st.url, userEmail: st.email, email: st.appEmail || '', password: st.appPw || '', freeLearn: true, liveOffers: true }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); return learnFailed(d.error || 'The crawl did not start.', null); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.appId) st.appId = ev.appId;
        if (liveEvent(ev, st.appId)) continue;
        if (ev.message && live) live.textContent = String(ev.message).slice(0, 140);
        if (ev.phase === 'error') {
          endLive();
          try { window.tpReportSignal && window.tpReportSignal({ type: 'stream_error', name: ev.category || 'unknown', message: ev.message, path: '/api/learn' }); } catch (e) {}
          return learnFailed(ev.message, ev.next);
        }
        if (ev.phase === 'done') { endLive(); if (live) live.textContent = 'done'; step('learned'); return afterLearn(); }
      }
    }
    if (st.appId) return afterLearn();
    learnFailed('The crawl stopped without finishing.', null);
  } catch (e) { learnFailed(netErr(e), null); }
}
function learnFailed(msg, next) {
  say(`<p>${esc(msg || 'I could not finish looking around your app.')}</p>${next && next.title ? `<p><b>${esc(next.title)}</b>: ${esc(next.text || '')}</p>` : ''}<p class="muted">If this was on our side, your free test is still waiting.</p>`, 'err');
  setReply(`<div class="row"><button onclick="learn()">Try again</button><button class="ghost" onclick="askLogin()">Change the login</button></div>`);
}

// ── 7. pick a test ────────────────────────────────────────
let picks = [];
async function suggest() {
  setReply('<div class="muted">Thinking of what to test…</div>');
  picks = [];
  try {
    const { res, data } = await postJson(`/api/v1/apps/${encodeURIComponent(st.appId)}/scenarios/suggest`, {});
    if (res.ok && Array.isArray(data.scenarios)) {
      const rank = { ai_suggested: 0, crawl_recipe: 1 };
      picks = data.scenarios.filter(Boolean).sort((a, b) => (rank[a.source] ?? 2) - (rank[b.source] ?? 2)).slice(0, 3);
    }

function gotSecond() {
  const e = (document.getElementById('be') || {}).value.trim(), p = (document.getElementById('bp') || {}).value;
  if (!e || !p) return say('<p>I need both the email and the password of the second account.</p>', 'err');
  if (e.toLowerCase() === String(st.appEmail || st.savedLogin || '').toLowerCase()) return say('<p>That is the same account as account 1. I need a different user.</p>', 'err');

// Plain words: what account 2 could reach, how much was really checked, and one
// message to paste into the builder's AI that asks for the right fix.
function securityReport(d) {
  const NEUTRAL = ['SAFE', 'INCONCLUSIVE', 'UNKNOWN', 'NOT_TESTED', 'SKIPPED', 'INFO'];
  const leaks = (d.results || []).filter((r) => !NEUTRAL.includes(String(r.verdict || '').toUpperCase()));
  const what = (r) => r.type === 'idor_direct' ? 'could open account 1’s record directly'
    : r.type === 'api_replay' ? 'got account 1’s data from the same request'
    : r.type === 'token_swap' ? 'was let in with account 1’s session'
    : 'reached something it should not';
  const c = d.coverage || {};
  const loginOk = !c.loginVerified || (c.loginVerified.userA && c.loginVerified.userB);
  const cov = c.dataEndpointsCaptured != null
    ? `<p class="muted">I tested ${esc(c.crossAccountTested || 0)} of the ${esc(c.dataEndpointsCaptured)} data requests your app makes${c.crossAccountInconclusive ? ` (${esc(c.crossAccountInconclusive)} could not be tested)` : ''}.</p>` : '';
  const back = [{ label: 'Run it again', desc: 'After you fixed something.', act: securityCheck }, { label: 'Test something else', act: showChoices }, { label: 'Another app', act: welcomeBack }];
  if (!loginOk) {
    say(`<p>I could not sign in as ${!c.loginVerified.userA ? 'account 1' : 'account 2'}, so the cross-account checks did not run. Check that login and try again.</p>${cov}`, 'err');
    if (!c.loginVerified.userB) { st.secondEmail = ''; st.secondPw = ''; }
    return menu('<p>What next?</p>', back);
  }
  if (!leaks.length) {
    say(`<p><b>Account 2 could not reach account 1’s data.</b> 🛡️</p>${cov}`);
    return menu('<p>What next?</p>', back);
  }
  const lines = leaks.slice(0, 8).map((r) => `${r.method || 'GET'} ${String(r.url || r.note || '').slice(0, 120)}`);
  say(`<p>⚠ <b>Account 2 reached account 1’s data in ${leaks.length} place${leaks.length === 1 ? '' : 's'}:</b></p>
    ${leaks.slice(0, 8).map((r, i) => `<div class="problem"><b>${i + 1}.</b> Account 2 ${what(r)}${r.severity && r.severity !== 'none' ? ` <span class="tag">${esc(String(r.severity).toUpperCase())}</span>` : ''}<div class="muted" style="margin-top:4px">${esc(lines[i])}</div></div>`).join('')}
    ${cov}`);
  const fix = `In my app, a signed-in user can read another user's data through these requests:\n${lines.join('\n')}\nMake each of them return only records that belong to the signed-in user (check ownership on the server or with row-level security), and change nothing else.`;
  const b = say(`<p>Paste this into ${esc(st.platformName && st.platform !== 'other' ? st.platformName + '’s AI chat' : 'your builder’s AI chat')}:</p><code class="box"></code><button class="ghost">Copy the fix</button>`);
  b.querySelector('code').textContent = fix;
  b.querySelector('button').onclick = function () { copy(fix, this); };
  menu('<p>What next?</p>', back);
}

// ── 8. run ────────────────────────────────────────────────
// Signs in with what it already has: the login typed on this page, else the
// saved one. Paid runs go on the client's key (asked once, here in the chat).
async function run(scenario) {
  st.lastScenario = scenario;
  const body = { appId: st.appId, scenario, userEmail: st.email, liveOffers: true, freeRun: !paid() && !onerun() && !st.freeUsed };
  if (st.appPw) { body.email = st.appEmail; body.password = st.appPw; }
  else if (st.savedLogin) body.useSavedLogin = true;
  if (paid()) {
    if (!claudeKey()) return askKey(() => run(scenario));
    body.apiKey = claudeKey();
  }
  setReply('<div class="muted">Testing… usually two to four minutes. You can leave this tab open.</div>');
  try {
    // Not retried on purpose: a second POST could spend the free run twice.
    const { res, data } = await postJson('/api/test', body);
    if (!res.ok || !data.testId) {
      if (data.code === 'SITE_NOT_VERIFIED') { say('<p>I need the ownership check again for this address.</p>', 'err'); return askVerify(); }
      if (data.code === 'SCENARIO_NOT_TESTABLE') { say(`<p>${esc(data.error || 'I cannot test that as written.')}</p>${data.hint ? `<p class="muted">${esc(data.hint)}</p>` : ''}`, 'err'); return ownTest(); }
      if (data.code === 'FREE_RUN_USED' || res.status === 402) { st.freeUsed = true; say(`<p>${esc(data.error || 'Your free test is used.')}</p>`, 'err'); return upsell(false); }
      if (data.code === 'SAVED_LOGIN_NOT_FOUND' || data.code === 'SAVED_LOGIN_UNREADABLE') { st.savedLogin = null; say(`<p>${esc(data.error)}</p>`, 'err'); st.afterCreds = () => run(scenario); return askCredsNow(); }
      if (data.code === 'API_KEY_REQUIRED' || data.code === 'API_KEY_INVALID') { say(`<p>${esc(data.error || 'I need your Claude API key.')}</p>`, 'err'); return askKey(() => run(scenario)); }
      say(`<p>${esc(data.error || 'The test did not start.')}</p>`, 'err');
      return showChoices();
    }
    st.testId = data.testId; step('run_started');
    const bubble = say('<p>Testing your app now, step by step…</p><p class="live" id="run-live">starting</p>');
    stream(data.testId, bubble.querySelector('#run-live'));
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); showChoices(); }
}
function stream(testId, live) {
  let finished = false;
  const finish = () => { if (finished) return; finished = true; endLive(); setTimeout(() => report(testId), 700); };
  const es = new EventSource('/api/test/' + testId + '/stream');
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'heartbeat') return;
    if (liveEvent(ev, testId)) return;
    if (ev.message && live) live.textContent = String(ev.message).slice(0, 140);
    if (ev.type === 'summary' || ev.type === 'done' || ev.type === 'complete' || ev.type === 'error') { es.close(); finish(); }   // an error ends the run too: the report reads it from the result
  };
  es.onerror = async () => {
    if (finished) return;
    try {
      const r = await (await fetch('/api/test/' + testId)).json();
      if (['running', 'starting', 'queued'].includes(r.status)) return;   // still alive: EventSource reconnects
    } catch (e) {}
    es.close(); finish();
  };
}

// ── Click-everything, in the chat ─────────────────────────
// Clicks every button and link it can find and reports what is dead. Anything

  // Only signing in costs Claude tokens; a paid account pays that on its own key.

    body.apiKey = claudeKey();
  }
  setReply('<div class="muted">Clicking everything… usually three to eight minutes. You can leave this tab open.</div>');
  let res, data;
  try { ({ res, data } = await postJson('/api/sweep', body)); } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); return showChoices(); }
  if (!res.ok || !data.sweepId) {
    if (data.code === 'FREE_SWEEP_USED') { say(`<p>${esc(data.error)}</p>`, 'err'); return upsell(false); }
    if (data.code === 'API_KEY_REQUIRED') return askKey(clickEverything);
    if (data.code === 'SAVED_LOGIN_NOT_FOUND' || data.code === 'SAVED_LOGIN_UNREADABLE') { st.savedLogin = null; say(`<p>${esc(data.error)}</p>`, 'err'); st.afterCreds = clickEverything; return askCredsNow(); }
    say(`<p>${esc(data.error || 'The check did not start.')}</p>`, 'err');
    return showChoices();
  }
  const sweepId = data.sweepId;
  const bubble = say('<p>Clicking every button and link I can find…</p><p class="live" id="sweep-live">starting</p>');
  const live = bubble.querySelector('#sweep-live');
  const es = new EventSource('/api/sweep/' + sweepId + '/stream');
  let finished = false;
  const finish = () => { if (finished) return; finished = true; es.close(); endLive(); sweepReport(sweepId); };
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'heartbeat') return;
    if (liveEvent(ev, sweepId)) return;
    if (ev.type === 'awaiting_confirm') return askSweepConfirm(sweepId, ev);
    if (ev.message && live) live.textContent = String(ev.message).slice(0, 140);
    if (ev.type === 'done') finish();
  };
  es.onerror = async () => {
    if (finished) return;
    try { const r = await (await fetch('/api/sweep/' + sweepId)).json(); if (r.status === 'running') return; } catch (e) {}
    finish();
  };
}
// "This one could delete data": asked as a chat message; the check waits.
function askSweepConfirm(sweepId, ev) {
  const b = say(`<p>⚠ ${esc(ev.question || 'Should I click this?')}</p>
    <div class="row"><button data-a="no">Skip it</button><button class="ghost" data-a="yes">Click it anyway</button></div>
    <label class="muted"><input type="checkbox" checked data-r> Remember my answer for "${esc(ev.label || '')}" on this app</label>`);
  b.querySelectorAll('button[data-a]').forEach((btn) => {
    btn.onclick = async () => {
      const allow = btn.dataset.a === 'yes';
      const remember = b.querySelector('[data-r]').checked;
      b.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      me(allow ? 'Click it anyway' : 'Skip it');
      await postJson('/api/sweep/' + sweepId + '/confirm', { allow, remember }).catch(() => {});
    };
  });
}
async function sweepReport(sweepId) {
  let r = {};
  try { r = await (await fetch('/api/sweep/' + sweepId)).json(); } catch (e) {}
  const items = Array.isArray(r.items) ? r.items : [];
  const count = (v) => items.filter((i) => i.verdict === v).length;
  const again = [
    { label: 'Run it again', desc: 'After you fixed something.', act: clickEverything },
    { label: 'Test something else', act: showChoices },
    { label: 'Another app', act: welcomeBack },
  ];
  if (!items.length) {
    say(`<p>The check stopped before it clicked anything${r.error ? ` (${esc(String(r.error).slice(0, 300))})` : ''}.</p>`, 'err');
    return menu('<p>What next?</p>', again);
  }
  const broken = items.filter((i) => i.verdict === 'broken');
  const defects = Array.isArray(r.defects) ? r.defects : [];
  const cov = r.coverage;
  say(`<p>I clicked <b>${items.length}</b> buttons and links: <b>${count('works')}</b> work${broken.length ? `, <b>${broken.length}</b> broken` : ''}${count('no_effect') ? `, ${count('no_effect')} did nothing` : ''}${count('skipped') ? `, ${count('skipped')} skipped` : ''}.</p>
    ${defects.length
      ? defects.map((d, i) => `<div class="problem"><b>${i + 1}.</b> ${esc(d.detail || '')}<div class="muted" style="margin-top:4px">On ${esc(d.controls)} control${d.controls === 1 ? '' : 's'}: ${esc((d.pages || []).join(', '))}</div></div>`).join('')
      : broken.length
        ? broken.slice(0, 10).map((i, k) => `<div class="problem"><b>${k + 1}.</b> "${esc(i.label)}" on ${esc(i.page)} is broken${i.detail ? `: ${esc(String(i.detail).slice(0, 160))}` : ''}</div>`).join('')
        : '<p>Nothing broken. ✅</p>'}
    ${count('no_effect') ? `<p class="muted">"Did nothing" means I clicked and nothing visible changed: often fine (a link to the same page), sometimes a dead button. ${items.filter((i) => i.verdict === 'no_effect').slice(0, 5).map((i) => `"${esc(i.label)}"`).join(', ')}</p>` : ''}
    ${cov && cov.pagesChecked < cov.pagesInApp ? `<p class="muted">This covered ${esc(cov.pagesChecked)} of ${esc(cov.pagesInApp)} pages (${esc(cov.stoppedBecause || '')}). The other pages were not opened.</p>` : ''}`);
  menu('<p>What next?</p>', again);
}

// ── 9. report: problems, fixes, what next ─────────────────
async function report(testId) {
  let r = {};
  try { r = await (await fetch('/api/test/' + testId)).json(); } catch (e) {}
  await refreshMe();   // a run that did not count gave the free run back
  step('report', r.status || '');
  const bugs = Array.isArray(r.bugs) ? r.bugs : [];
  const status = r.status || '';
  // completed_with_unverified is a pass too: the flow worked, one check could not
  // be fully confirmed (it used to read as "stopped before a verdict").
  if (!bugs.length && ['completed', 'completed_with_unverified'].includes(status)) {
    say(`<p><b>Everything in this test worked.</b> ✅ ${esc((r.steps || []).length)} steps, no problems found.</p>${status === 'completed_with_unverified' ? '<p class="muted">One check could not be fully confirmed from the page, so take a quick look yourself if it matters.</p>' : ''}`);
    return paid() ? whatNext(r, true) : upsell(false);
  }
  if (!bugs.length) {
    say(`<p>The test stopped before it could give a verdict${r.error ? ` (${esc(String(r.error).slice(0, 300))})` : ''}.</p><p>When that is on our side, it does not count, so you can run it again.</p>`, 'err');
    return menu('<p>What next?</p>', [
      { label: 'Run it again', act: () => run(st.lastScenario) },
      { label: 'Test something else', act: showChoices },
    ]);
  }
  const all = paid();
  say(`<p>I found <b>${bugs.length} problem${bugs.length === 1 ? '' : 's'}</b>:</p>
    ${bugs.map((b, i) => `<div class="problem${!all && i ? ' locked' : ''}"><b>${i + 1}.</b> ${esc(String(b.description || b).slice(0, 300))}${!all && i ? '<div class="muted" style="margin-top:4px">🔒 Fix prompt included in the €15/month plan</div>' : ''}</div>`).join('')}`);
  const where = esc(st.platformName && st.platform !== 'other' ? st.platformName + '’s AI chat' : 'your builder’s AI chat');
  // All fixes are written at once; each bubble fills as its answer comes back.
  const count = all ? bugs.length : 1;
  await Promise.all(Array.from({ length: count }, async (_, i) => {
    const bubble = say(`<p>The fix for problem ${i + 1}. Paste it into ${where}:</p><p class="live" id="fix-live-${i}">writing it…</p>`);
    try {
      const { res, data } = await postJson('/api/fix-prompt', { testId, index: i, platform: st.platform, apiKey: all ? claudeKey() : undefined });
      const live = bubble.querySelector('#fix-live-' + i);
      if (res.ok && data.prompt) {
        live.outerHTML = `<code class="box" id="fix-box-${i}">${esc(data.prompt)}</code><button class="ghost" onclick="copy(document.getElementById('fix-box-${i}').textContent,this)">Copy the fix</button>`;
        step('fix_shown');
      } else live.textContent = data.error || 'I could not write the fix right now.';
    } catch (e) { bubble.querySelector('#fix-live-' + i).textContent = netErr(e); }
  }));
  return all ? whatNext(r, false) : upsell(bugs.length > 1);
}
function whatNext(r, clean) {
  const items = [];
  if (!clean) items.push({ label: 'Retest', desc: 'After you pasted the fix and published your app: the same test again.', act: () => run(st.lastScenario) });
  if (clean) {
    const month = r.costEur ? `about €${Math.max(0.01, r.costEur * 30).toFixed(2)}/month on your Claude key` : 'usually €3–€15/month on your Claude key';
    items.push({ label: 'Keep watching it daily', desc: `I rerun it every day and only message you when it breaks, with the fix. ${month}.`, act: keepWatching });
  }
  items.push({ label: 'Test something else', desc: '', act: showChoices });
  items.push({ label: 'Another app', desc: '', act: welcomeBack });
  menu('<p>What next?</p>', items);
}
async function keepWatching() {
  if (!claudeKey()) return askKey(keepWatching);
  // A typed login that was not saved cannot be reused by a daily run.
  if (st.appPw && !st.savedLogin) {
    say('<p>The daily check signs in on its own, so it needs the login saved.</p>');
    return askSaveLogin(keepWatching, () => {
      say('<p>Then I cannot watch it daily. You can save the login any time and set it up again.</p>');
      menu('<p>What next?</p>', [{ label: 'Test something else', act: showChoices }, { label: 'Another app', act: welcomeBack }]);
    });
  }
  try {
    const { res, data } = await postJson('/api/schedules', { appId: st.appId, scenario: st.lastScenario, intervalHours: 24, apiKey: claudeKey(), useSavedLogin: !!st.savedLogin || undefined });
    if (res.ok) say('<p>👀 Watching it daily. You only hear from me if it breaks, with the fix ready to paste.</p>');
    else say(`<p>${esc(data.error || 'I could not set that up.')}</p>`, 'err');
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); }
  menu('<p>What next?</p>', [
    { label: 'Test something else', act: showChoices },
    { label: 'Another app', act: welcomeBack },
  ]);
}
function upsell(moreFixes) {
  say(`<p>${moreFixes ? 'Want the fixes for the other problems, and a retest once you have applied them?' : 'Want me to keep testing as you build?'}</p>
    <div class="plan"><b>€15</b><span class="muted"> /month + VAT</span>
      <div class="muted" style="margin-top:4px">Unlimited apps and test runs · a fix prompt for every problem · retest while you fix · keep watching. You connect your own Claude API key (a typical test costs €0.10–€0.50).</div></div>`);
  setReply(`<div class="row"><button onclick="checkout()">Get the €15 plan</button><button class="ghost" onclick="showChoices()">Test something else</button></div>`);
}
async function checkout() {
  step('upgrade_click');
  try {
    const { data } = await postJson('/api/billing/checkout', { plan: 'monthly' });
    if (data.url) return void (location.href = data.url);
    say(`<p>${esc(data.error || 'Checkout did not open.')}</p>`, 'err');
  } catch (e) { say('<p>' + esc(netErr(e)) + '</p>', 'err'); }
}

start();
</script>
